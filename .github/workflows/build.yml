name: Build portable Windows executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish portable executable
        run: dotnet publish src/CodexQuotaBar.Portable/CodexQuotaBar.Portable.csproj -c Release -o output/portable
      - name: Name portable download
        run: Copy-Item output/portable/Codex剩余额度条.exe output/portable/CodexQuotaBar-Portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: codex-quota-bar-portable-windows
          path: output/portable/CodexQuotaBar-Portable.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME output/portable/CodexQuotaBar-Portable.exe --title $env:GITHUB_REF_NAME --generate-notes
